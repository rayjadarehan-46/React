name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes (Cron format)
    - cron: '*/10 * * * *'
  # Allows you to manually trigger it from the GitHub Actions tab if needed
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          curl -s https://devboard-api-lcj0.onrender.com/
